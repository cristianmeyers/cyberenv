# =============================================
# DDNS Config
# =============================================

include "/etc/dhcp/rndc.key";
ddns-update-style interim;
ddns-domainname "sio.lan";
ddns-rev-domainname "in-addr.arpa";
update-static-leases on;
zone sio.lan. { primary 127.0.0.1; key rndc-key; }
zone 10.168.192.in-addr.arpa. { primary 127.0.0.1; key rndc-key; }
zone 20.168.192.in-addr.arpa. { primary 127.0.0.1; key rndc-key; }
zone 30.168.192.in-addr.arpa. { primary 127.0.0.1; key rndc-key; }
zone 40.168.192.in-addr.arpa. { primary 127.0.0.1; key rndc-key; }
zone 50.168.192.in-addr.arpa. { primary 127.0.0.1; key rndc-key; }
zone 60.168.192.in-addr.arpa. { primary 127.0.0.1; key rndc-key; }


# Global settings

default-lease-time 86400;
max-lease-time 172800;
authoritative;

option domain-name "sio.lan";
option domain-name-servers 192.168.10.4, 8.8.8.8;


