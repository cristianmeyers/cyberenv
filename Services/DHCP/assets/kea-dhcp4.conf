{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [
        "ens18"
      ],
      "dhcp-socket-type": "raw"
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.10.0/24",
        "pools": [
          {
            "pool": "192.168.10.50 - 192.168.10.150"
          }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "192.168.10.1"
          },
          {
            "name": "domain-name-servers",
            "data": "192.168.10.4"
          },
          {
            "name": "domain-name",
            "data": "sio.lan"
          }
        ],
        "reservations": [
          {
            "hw-address": "bc:24:11:dc:9e:c5",
            "ip-address": "192.168.10.20",
            "hostname": "siowin",
            "user-context": {
              "location": "siovirt2",
              "user": "sio",
              "date": "2024-2026",
              "description": "client windows ad"
            }
          }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          {
            "output": "stdout"
          }
        ],
        "severity": "INFO"
      }
    ]
  }
}
