{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["ens18"],
      "dhcp-socket-type": "raw"
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },
    "client-classes": [
      {
        "name": "UEFI-x64",
        "test": "substring(option[60].text, 0, 9) == 'PXEClient' and (option[93].hex == 0x0007 or option[93].hex == 0x0009)",
        "option-data": [
          { "name": "boot-file-name", "data": "ipxe.efi" }
        ]
      },
      {
        "name": "BIOS-Legacy",
        "test": "substring(option[60].text, 0, 9) == 'PXEClient' and option[93].hex == 0x0000",
        "option-data": [
          { "name": "boot-file-name", "data": "undionly.kpxe" }
        ]
      },
      {
        "name": "Catch-All-PXE",
        "test": "substring(option[60].text, 0, 9) == 'PXEClient'",
        "option-data": [
          { "name": "boot-file-name", "data": "ipxe.efi" }
        ]
      }
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.10.0/24",
        "next-server": "192.168.10.8",
        "pools": [
          { "pool": "192.168.10.50 - 192.168.10.150" }
        ],
        "option-data": [
          { "name": "routers", "data": "192.168.10.1" },
          { "name": "domain-name-servers", "data": "192.168.10.4" },
          { "name": "domain-name", "data": "sio.lan" },
          { "name": "tftp-server-name", "data": "192.168.10.8" }
        ],
        "reservations": [
          { "hw-address": "bc:24:11:76:0f:41", "ip-address": "192.168.10.4", "hostname": "sioad", "user-context": { "location": "siovirt2", "user": "sio", "date": "2024-2026", "description": "serveur samba ad" } },
          { "hw-address": "bc:24:11:3b:32:68", "ip-address": "192.168.10.5", "hostname": "siodb", "user-context": { "location": "siovirt2", "user": "sio", "date": "2024-2026", "description": "Base de données" } },
          { "hw-address": "bc:24:11:6f:48:86", "ip-address": "192.168.10.6", "hostname": "siolnx", "user-context": { "location": "siovirt2", "user": "sio", "date": "2024-2026", "description": "Serveur Web linux" } },
          { "hw-address": "bc:24:11:42:db:b7", "ip-address": "192.168.10.8", "hostname": "siofog", "user-context": { "location": "siovirt2", "user": "sio", "date": "2024-2026", "description": "Serveur Fog" } },
          { "hw-address": "bc:24:11:d4:9e:c5", "ip-address": "192.168.10.20", "hostname": "siowin", "user-context": { "location": "siovirt2", "user": "sio", "date": "2024-2026", "description": "client windows ad" } }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [{ "output": "stdout" }],
        "severity": "INFO"
      }
    ]
  }
}