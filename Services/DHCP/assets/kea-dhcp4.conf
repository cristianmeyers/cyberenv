{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["ens18"],
      "dhcp-socket-type": "raw"
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },
    "client-classes": [
      {
        "name": "UEFI-x64",
        "test": "substring(option[60].text, 0, 9) == 'PXEClient' and (option[93].hex == 0x0007 or option[93].hex == 0x0009)",
        "option-data": [ { "name": "boot-file-name", "data": "ipxe.efi" } ]
      },
      {
        "name": "BIOS-Legacy",
        "test": "substring(option[60].text, 0, 9) == 'PXEClient' and option[93].hex == 0x0000",
        "option-data": [ { "name": "boot-file-name", "data": "undionly.kpxe" } ]
      }
    ],
