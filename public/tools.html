    <style>
        :root {
            --bg-base: #EEF0F8;
            --surface: rgba(255, 255, 255, 0.72);
            --surface-s: rgba(255, 255, 255, 0.55);
            --border: rgba(0, 0, 0, 0.07);
            --border-h: rgba(0, 0, 0, 0.14);
            --shadow-sm: 0 1px 4px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
            --shadow-md: 0 4px 24px rgba(0, 0, 0, .08), 0 1px 4px rgba(0, 0, 0, .05);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, .12), 0 4px 12px rgba(0, 0, 0, .07);
            --primary: #1A6CF0;
            --primary-l: rgba(26, 108, 240, 0.10);
            --text: #16181F;
            --text-2: #52596A;
            --text-3: #9BA3B2;
            --radius: 18px;
            --radius-sm: 11px;
            --font: 'DM Sans', sans-serif;
            --blob1: rgba(99, 130, 255, 0.20);
            --blob2: rgba(255, 140, 90, 0.16);
            --blob3: rgba(100, 220, 180, 0.16);
            --blob4: rgba(200, 100, 240, 0.12);
            --blob5: rgba(255, 200, 80, 0.13);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-base: #0F1117;
                --surface: rgba(255, 255, 255, 0.055);
                --surface-s: rgba(255, 255, 255, 0.04);
                --border: rgba(255, 255, 255, 0.08);
                --border-h: rgba(255, 255, 255, 0.16);
                --shadow-sm: 0 1px 4px rgba(0, 0, 0, .4), 0 1px 2px rgba(0, 0, 0, .3);
                --shadow-md: 0 4px 24px rgba(0, 0, 0, .5), 0 1px 4px rgba(0, 0, 0, .3);
                --shadow-lg: 0 16px 48px rgba(0, 0, 0, .6), 0 4px 12px rgba(0, 0, 0, .4);
                --primary: #5B9EFF;
                --primary-l: rgba(91, 158, 255, 0.13);
                --text: #E8EAF0;
                --text-2: #8C94A8;
                --text-3: #4E5668;
                --blob1: rgba(80, 110, 255, 0.26);
                --blob2: rgba(255, 100, 60, 0.17);
                --blob3: rgba(40, 200, 150, 0.17);
                --blob4: rgba(180, 60, 240, 0.17);
                --blob5: rgba(255, 180, 40, 0.13);
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: var(--bg-base);
            font-family: var(--font);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ---- Mesh blobs ---- */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-mesh::before,
        .bg-mesh::after,
        .bg-mesh span:nth-child(1),
        .bg-mesh span:nth-child(2),
        .bg-mesh span:nth-child(3) {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: drift 22s ease-in-out infinite alternate;
        }

        .bg-mesh::before {
            width: 600px;
            height: 600px;
            background: var(--blob1);
            top: -130px;
            left: -110px;
            animation-duration: 22s;
        }

        .bg-mesh::after {
            width: 500px;
            height: 500px;
            background: var(--blob2);
            bottom: -110px;
            right: -90px;
            animation-duration: 19s;
            animation-delay: -6s;
        }

        .bg-mesh span:nth-child(1) {
            width: 420px;
            height: 420px;
            background: var(--blob3);
            top: 40%;
            left: 54%;
            animation-duration: 27s;
            animation-delay: -11s;
        }

        .bg-mesh span:nth-child(2) {
            width: 360px;
            height: 360px;
            background: var(--blob4);
            top: 20%;
            right: 4%;
            animation-duration: 21s;
            animation-delay: -4s;
        }

        .bg-mesh span:nth-child(3) {
            width: 300px;
            height: 300px;
            background: var(--blob5);
            bottom: 16%;
            left: 14%;
            animation-duration: 31s;
            animation-delay: -16s;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(28px, -22px) scale(1.04);
            }

            66% {
                transform: translate(-18px, 18px) scale(0.97);
            }

            100% {
                transform: translate(12px, -8px) scale(1.02);
            }
        }

        /* ---- Top stripe ---- */
        .stripe {
            width: 100%;
            height: 3px;
            flex-shrink: 0;
            background: linear-gradient(90deg,
                    #E55C00, #0057A8, #6B21A8, #DC2626, #0D7D5F, #F46800, #15B8A6, #5CDD8B);
            position: relative;
            z-index: 10;
        }

        /* ---- Corner elements ---- */
        .corner {
            position: fixed;
            top: 18px;
            z-index: 20;
            animation: fadeIn .4s ease both;
        }

        .corner-left {
            left: 32px;
        }

        .corner-right {
            right: 32px;
            text-align: right;
        }

        .corner-left a {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px 6px 10px;
            background: var(--primary-l);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            transition: opacity .18s;
        }

        .back-btn:hover {
            opacity: .75;
        }

        .back-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .page-title {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: var(--primary);
            letter-spacing: -.3px;
            line-height: 1;
        }

        .page-sub {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 3px;
        }

        #clock {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -1.5px;
            line-height: 1;
            color: var(--text);
        }

        #datestamp {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 3px;
        }

        /* ---- Page ---- */
        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1280px;
            padding: 90px 40px 80px;
            display: flex;
            flex-direction: column;
            gap: 36px;
        }

        /* ---- Section ---- */
        .section-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .section-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--group-color);
            flex-shrink: 0;
            box-shadow: 0 0 8px var(--group-color);
        }

        .section-head h2 {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-3);
            white-space: nowrap;
        }

        .section-head .line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ---- Cards grid ---- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        /* ---- Service card ---- */
        .svc-card {
            background: var(--surface);
            backdrop-filter: blur(18px) saturate(1.3);
            -webkit-backdrop-filter: blur(18px) saturate(1.3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 22px 18px 18px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            position: relative;
            overflow: hidden;
            transition: box-shadow .22s, transform .18s, border-color .22s;
        }

        .svc-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--card-color, var(--primary));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .22s ease;
        }

        .svc-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
            border-color: var(--border-h);
        }

        .svc-card:hover::before {
            transform: scaleX(1);
        }

        .svc-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: color-mix(in srgb, var(--card-color, #888) 12%, var(--surface));
            border: 1px solid color-mix(in srgb, var(--card-color, #888) 20%, transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            transition: transform .18s;
        }

        .svc-card:hover .svc-icon {
            transform: scale(1.08);
        }

        .svc-icon svg {
            width: 22px;
            height: 22px;
            fill: var(--card-color, var(--primary));
            display: block;
        }

        .svc-icon img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            display: block;
        }

        .svc-info {
            flex: 1;
            min-width: 0;
        }

        .svc-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .svc-desc {
            font-size: 11.5px;
            color: var(--text-3);
            margin-top: 3px;
            line-height: 1.4;
        }

        .svc-url {
            font-size: 10px;
            color: var(--text-3);
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            font-family: monospace;
            opacity: .7;
        }

        .svc-arrow {
            position: absolute;
            bottom: 14px;
            right: 14px;
            font-size: 14px;
            color: var(--text-3);
            opacity: 0;
            transition: opacity .2s, right .18s;
        }

        .svc-card:hover .svc-arrow {
            opacity: 1;
            right: 10px;
        }

        /* ---- Search bar ---- */
        .search-wrap {
            position: sticky;
            top: 0;
            z-index: 15;
            padding: 14px 0 0;
        }

        .search-inner {
            background: var(--surface);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 10px;
        }

        .search-inner svg {
            width: 16px;
            height: 16px;
            fill: var(--text-3);
            flex-shrink: 0;
        }

        #filter {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--font);
            font-size: 14px;
            color: var(--text);
            padding: 14px 0;
        }

        #filter::placeholder {
            color: var(--text-3);
        }

        #filter-count {
            font-size: 11px;
            color: var(--text-3);
            white-space: nowrap;
        }

        /* ---- Footer credit ---- */
        .credit {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            font-size: 11.5px;
            color: var(--text-3);
            background: transparent;
            pointer-events: none;
        }

        .credit>*,
        .credit a {
            pointer-events: auto;
        }

        .credit-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: opacity .18s;
        }

        .credit-link:hover {
            opacity: .75;
        }

        .credit-link svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* ---- Animations ---- */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .group-block {
            animation: fadeIn .4s ease both;
        }

        .group-block:nth-child(2) {
            animation-delay: .06s;
        }

        .group-block:nth-child(3) {
            animation-delay: .12s;
        }

        .group-block:nth-child(4) {
            animation-delay: .18s;
        }

        .group-block:nth-child(5) {
            animation-delay: .24s;
        }

        /* hidden during filter */
        .svc-card[hidden] {
            display: none;
        }

        .group-block[data-empty] {
            display: none;
        }
    </style>
</head>

<body>

    <div class="bg-mesh" aria-hidden="true">
        <span></span><span></span><span></span>
    </div>

    <div class="stripe"></div>

    <!-- Top-left -->
    <div class="corner corner-left">
        <a class="back-btn" href="./startpage.html">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
            Accueil
        </a>
        <div class="page-title" style="margin-top:10px;">🛠️ Tools</div>
        <div class="page-sub">Liens du laboratoire</div>
    </div>

    <!-- Top-right -->
    <div class="corner corner-right">
        <div id="clock">--:--</div>
        <div id="datestamp">---</div>
    </div>

    <div class="page">

        <!-- Search / filter -->
        <div class="search-wrap">
            <div class="search-inner">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                </svg>
                <input id="filter" type="text" placeholder="Filtrer les services…" autocomplete="off"
                    spellcheck="false" />
                <span id="filter-count"></span>
            </div>
        </div>

        <!-- Groups rendered by JS -->
        <div id="groups-container"></div>

    </div>

    <!-- Credit bar -->
    <footer class="credit">
        <span>Created by</span>
        <a class="credit-link" href="https://www.linkedin.com/in/cristianmeyers/" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24">
                <path
                    d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
            </svg>
            Cristin Meyers
        </a>
        <span>· Tous droits réservés</span>
    </footer>

    <script>
        /* ---- Render groups from LAB_CONFIG ---- */
        function renderIcon(icon) {
            if (!icon) return `<span>🔧</span>`;
            if (icon.startsWith('img:')) {
                return `<img src="${icon.slice(4)}" alt="" onerror="this.parentElement.textContent='🔧'"/>`;
            }
            if (icon.startsWith('svg:')) {
                return `<svg viewBox="0 0 24 24"><path d="${icon.slice(4)}"/></svg>`;
            }
            // emoji
            return `<span>${icon}</span>`;
        }

        function buildCards(items, groupColor) {
            return items.map(item => {
                const color = item.color || groupColor;
                const urlDisplay = item.url.replace(/^https?:\/\//, '');
                return `
      <a class="svc-card" href="${item.url}" target="_blank" style="--card-color:${color}"
         data-name="${item.name.toLowerCase()}" data-desc="${(item.desc || '').toLowerCase()}">
        <div class="svc-icon">${renderIcon(item.icon)}</div>
        <div class="svc-info">
          <div class="svc-name">${item.name}</div>
          ${item.desc ? `<div class="svc-desc">${item.desc}</div>` : ''}
          <div class="svc-url">${urlDisplay}</div>
        </div>
        <span class="svc-arrow">→</span>
      </a>`;
            }).join('');
        }

        function render() {
            const container = document.getElementById('groups-container');
            container.innerHTML = LAB_CONFIG.map((group, i) => `
    <div class="group-block" style="animation-delay:${i * 0.07}s">
      <div class="section-head">
        <div class="section-dot" style="--group-color:${group.color}"></div>
        <h2>${group.name}</h2>
        <div class="line"></div>
      </div>
      <div class="cards-grid">${buildCards(group.items, group.color)}</div>
    </div>
  `).join('');
        }

        /* ---- Filter logic ---- */
        function updateFilter(q) {
            const lower = q.trim().toLowerCase();
            let total = 0, visible = 0;

            document.querySelectorAll('.group-block').forEach(group => {
                let groupVisible = 0;
                group.querySelectorAll('.svc-card').forEach(card => {
                    total++;
                    const match = !lower ||
                        card.dataset.name.includes(lower) ||
                        card.dataset.desc.includes(lower);
                    card.hidden = !match;
                    if (match) { groupVisible++; visible++; }
                });
                if (groupVisible === 0) group.setAttribute('data-empty', '');
                else group.removeAttribute('data-empty');
            });

            const count = document.getElementById('filter-count');
            count.textContent = lower ? `${visible} résultat${visible !== 1 ? 's' : ''}` : '';
        }

        document.getElementById('filter').addEventListener('input', e => updateFilter(e.target.value));

        /* ---- Clock ---- */
        const jours = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
        const mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

        function tick() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;
            document.getElementById('datestamp').textContent =
                `${jours[now.getDay()]} ${now.getDate()} ${mois[now.getMonth()]}`;
        }

        render();
        tick();
        setInterval(tick, 10000);
        document.getElementById('filter').focus();
    </script>
</body>

</html>
