    <style>
        :root {
            --bg-base: #EEF0F8;
            --surface: rgba(255, 255, 255, 0.78);
            --border: rgba(0, 0, 0, 0.07);
            --border-h: rgba(0, 0, 0, 0.13);
            --shadow-sm: 0 1px 4px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
            --shadow-md: 0 4px 24px rgba(0, 0, 0, .08), 0 1px 4px rgba(0, 0, 0, .05);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, .12), 0 4px 12px rgba(0, 0, 0, .07);
            --primary: #1A6CF0;
            --primary-l: rgba(26, 108, 240, 0.10);
            --text: #16181F;
            --text-2: #52596A;
            --text-3: #9BA3B2;
            --radius: 16px;
            --font: 'DM Sans', sans-serif;
            --blob1: rgba(99, 130, 255, 0.18);
            --blob2: rgba(255, 100, 60, 0.13);
            --blob3: rgba(100, 220, 180, 0.13);
            --blob4: rgba(180, 60, 240, 0.10);
            --blob5: rgba(255, 200, 80, 0.11);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-base: #0F1117;
                --surface: rgba(255, 255, 255, 0.058);
                --border: rgba(255, 255, 255, 0.08);
                --border-h: rgba(255, 255, 255, 0.16);
                --shadow-sm: 0 1px 4px rgba(0, 0, 0, .4), 0 1px 2px rgba(0, 0, 0, .3);
                --shadow-md: 0 4px 24px rgba(0, 0, 0, .5), 0 1px 4px rgba(0, 0, 0, .3);
                --shadow-lg: 0 16px 48px rgba(0, 0, 0, .6), 0 4px 12px rgba(0, 0, 0, .4);
                --primary: #5B9EFF;
                --primary-l: rgba(91, 158, 255, 0.13);
                --text: #E8EAF0;
                --text-2: #8C94A8;
                --text-3: #4E5668;
                --blob1: rgba(80, 110, 255, 0.22);
                --blob2: rgba(255, 80, 40, 0.14);
                --blob3: rgba(40, 200, 150, 0.14);
                --blob4: rgba(160, 50, 240, 0.14);
                --blob5: rgba(255, 180, 40, 0.11);
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: var(--bg-base);
            font-family: var(--font);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ── Mesh ── */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-mesh::before,
        .bg-mesh::after,
        .bg-mesh span:nth-child(1),
        .bg-mesh span:nth-child(2),
        .bg-mesh span:nth-child(3) {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: drift 22s ease-in-out infinite alternate;
        }

        .bg-mesh::before {
            width: 580px;
            height: 580px;
            background: var(--blob1);
            top: -130px;
            left: -110px;
        }

        .bg-mesh::after {
            width: 500px;
            height: 500px;
            background: var(--blob2);
            bottom: -110px;
            right: -90px;
            animation-duration: 19s;
            animation-delay: -6s;
        }

        .bg-mesh span:nth-child(1) {
            width: 420px;
            height: 420px;
            background: var(--blob3);
            top: 40%;
            left: 54%;
            animation-duration: 27s;
            animation-delay: -11s;
        }

        .bg-mesh span:nth-child(2) {
            width: 360px;
            height: 360px;
            background: var(--blob4);
            top: 20%;
            right: 4%;
            animation-duration: 21s;
            animation-delay: -4s;
        }

        .bg-mesh span:nth-child(3) {
            width: 300px;
            height: 300px;
            background: var(--blob5);
            bottom: 16%;
            left: 14%;
            animation-duration: 31s;
            animation-delay: -16s;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(28px, -22px) scale(1.04);
            }

            66% {
                transform: translate(-18px, 18px) scale(.97);
            }

            100% {
                transform: translate(12px, -8px) scale(1.02);
            }
        }

        /* ── Stripe ── */
        .stripe {
            width: 100%;
            height: 3px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
            background: linear-gradient(90deg, #E55C00, #CC0000, #1B6CA8, #0057A8, #1565C0, #4A90D9);
        }

        /* ── Corners ── */
        .corner {
            position: fixed;
            top: 18px;
            z-index: 20;
            animation: fadeIn .4s ease both;
        }

        .corner-left {
            left: 32px;
        }

        .corner-right {
            right: 32px;
            text-align: right;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px 6px 10px;
            background: var(--primary-l);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            transition: opacity .18s;
        }

        .back-btn:hover {
            opacity: .72;
        }

        .back-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .page-title {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: var(--primary);
            letter-spacing: -.3px;
            line-height: 1;
            margin-top: 10px;
        }

        .page-sub {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 3px;
        }

        #clock {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -1.5px;
            line-height: 1;
            color: var(--text);
        }

        #datestamp {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 3px;
        }

        /* ── Page ── */
        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1280px;
            padding: 100px 40px 100px;
            display: flex;
            flex-direction: column;
        }

        /* ── Groups container — gap here controls space between sections ── */
        #groups-container {
            display: flex;
            flex-direction: column;
            gap: 80px;
        }

        /* ── Section head ── */
        .section-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .section-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--group-color);
            box-shadow: 0 0 8px var(--group-color);
            flex-shrink: 0;
        }

        .section-head h2 {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-3);
            white-space: nowrap;
        }

        .section-head .line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Grid ── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        /* ── Card — flat, no nested box ── */
        .svc-card {
            background: var(--surface);
            backdrop-filter: blur(18px) saturate(1.3);
            -webkit-backdrop-filter: blur(18px) saturate(1.3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 28px 20px 22px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: box-shadow .22s, transform .18s, border-color .22s;
            text-align: center;
        }

        /* top accent bar on hover */
        .svc-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--card-color, var(--primary));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .24s ease;
        }

        .svc-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
            border-color: color-mix(in srgb, var(--card-color, var(--primary)) 30%, var(--border));
        }

        .svc-card:hover::before {
            transform: scaleX(1);
        }

        /* ── Logo — just the image, no wrapper ── */
        .svc-logo {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform .18s;
        }

        .svc-card:hover .svc-logo {
            transform: scale(1.08);
        }

        .svc-logo svg {
            width: 52px;
            height: 52px;
            display: block;
        }

        .svc-logo img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            display: block;
        }

        /* simpleicons gère la couleur via l'URL — pas besoin d'inversion */

        /* ── Text ── */
        .svc-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .svc-short {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.2;
        }

        .svc-full {
            font-size: 10.5px;
            color: var(--text-3);
            font-family: monospace;
            line-height: 1.5;
            word-break: break-all;
        }

        /* ── Animations ── */
        .group-block {
            animation: fadeIn .4s ease both;
        }

        .group-block:nth-child(2) {
            animation-delay: .07s;
        }

        .group-block:nth-child(3) {
            animation-delay: .14s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Footer ── */
        .credit {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            font-size: 11.5px;
            color: var(--text-3);
            background: transparent;
            pointer-events: none;
        }

        .credit>*,
        .credit a {
            pointer-events: auto;
        }

        .credit-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: opacity .18s;
        }

        .credit-link:hover {
            opacity: .72;
        }

        .credit-link svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
            flex-shrink: 0;
        }
    </style>
</head>

    <script>
        /* Logos via Simple Icons CDN ou SVG inline pour les logos absents */

        function logoHtml(item) {
            if (item.svgLogo) return item.svgLogo;
            if (item.logo) return `<img src="${item.logo}" alt="${item.shortName}"
    onerror="this.parentElement.innerHTML='<span style=font-size:36px>🔧</span>'"/>`;
            return `<span style="font-size:36px">🔧</span>`;
        }

        function render() {
            document.getElementById('groups-container').innerHTML =
                LAB_CONFIG.map((group, i) => `
      <div class="group-block" style="animation-delay:${i * 0.07}s">
        <div class="section-head">
          <div class="section-dot" style="--group-color:${group.color}"></div>
          <h2>${group.name}</h2>
          <div class="line"></div>
        </div>
        <div class="cards-grid">
          ${group.items.map(item => {
                    const color = item.color || group.color;
                    return `
              <a class="svc-card" href="${item.url}" target="_blank"
                 style="--card-color:${color}">
                <div class="svc-logo">
                  ${logoHtml(item)}
                </div>
                <div class="svc-info">
                  <div class="svc-short">${item.shortName}</div>
                  <div class="svc-full">${item.fullName}</div>
                </div>
              </a>`;
                }).join('')}
        </div>
      </div>`).join('');
        }

        const jours = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
        const mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
        function tick() {
            const n = new Date();
            document.getElementById('clock').textContent =
                `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;
            document.getElementById('datestamp').textContent =
                `${jours[n.getDay()]} ${n.getDate()} ${mois[n.getMonth()]}`;
        }

        render();
        tick();
        setInterval(tick, 10000);
    </script>
